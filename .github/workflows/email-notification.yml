name: Email Notification on Master Push

on:
  push:
    branches:
      - master

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: New Commit Pushed to Master in PracticeProjects
          body: A commit was pushed to the master branch. Check https://github.com/JadhavAditya/PracticeProjects for details.
          to: aditya.jadhav.work@gmail.com
          from: ${{ secrets.EMAIL_USERNAME }}